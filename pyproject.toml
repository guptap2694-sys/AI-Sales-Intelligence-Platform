[project]
name = "ai-sales-intelligence-platform"
version = "0.1.0"
description = "Ranked, explainable cybersecurity target accounts from raw company data"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pyarrow>=15.0", "pyyaml>=6.0", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
