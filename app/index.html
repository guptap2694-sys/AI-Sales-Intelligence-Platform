<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perimeter Radar</title>
<meta name="description" content="Prospecting desk for cybersecurity sales: ranked accounts, buying signals, AI briefs and outreach drafts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22none%22 stroke=%22%230d6b77%22 stroke-width=%223%22/%3E%3Cpath d=%22M16 16V3a13 13 0 0 1 11.3 6.5z%22 fill=%22%230d6b77%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".35"/>
        <circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".6"/>
        <path d="M16 16 L16 3 A13 13 0 0 1 27.3 9.5 Z" fill="currentColor" opacity=".9"/>
        <circle cx="21.5" cy="11" r="2.2" fill="currentColor"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Perimeter Radar</span>
        <span class="brand-meta" id="meta-line">Loading accounts…</span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button class="tab" role="tab" id="tab-list" data-view="list" aria-selected="true">Priorities</button>
      <button class="tab" role="tab" id="tab-market" data-view="market" aria-selected="false">Market</button>
      <button class="tab" role="tab" id="tab-tuner" data-view="tuner" aria-selected="false">ICP tuner</button>
      <button class="tab" role="tab" id="tab-shortlist" data-view="shortlist" aria-selected="false">Shortlist <span class="count-pill" id="shortlist-count">0</span></button>
    </nav>
    <div class="top-actions">
      <span class="icp-pill" id="icp-pill" hidden>Custom ICP</span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme: system" title="Theme: system">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3.5 A6.5 6.5 0 0 1 10 16.5 Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <div class="banner" id="demo-banner" hidden></div>
  <main class="main" id="main">
    <div class="loading" id="loading">Loading accounts…</div>
  </main>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Account detail" tabindex="-1"></aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
