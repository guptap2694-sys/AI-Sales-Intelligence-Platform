<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22none%22 stroke=%22%230d6b77%22 stroke-width=%223%22/%3E%3Cpath d=%22M16 16V3a13 13 0 0 1 11.3 6.5z%22 fill=%22%230d6b77%22/%3E%3C/svg%3E">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Perimeter Radar — a prospecting desk. Layout: fixed top bar + tabs, one working surface per view
   (filter rail + virtualised ranked list, market charts, ICP tuner), detail opens in a right drawer. */
:root {
  /* colour: cool instrument-panel neutrals, deep teal for "act on this" */
  --bg: #f2f4f6;
  --surface: #ffffff;
  --surface-2: #eaeef1;
  --surface-3: #dfe5e9;
  --ink: #0f1a22;
  --ink-2: #47545f;
  --muted: #76838e;
  --line: #d9dfe4;
  --line-strong: #c3ccd3;
  --accent: #0d6b77;
  --accent-ink: #ffffff;
  --accent-soft: #dcf0f2;
  --focus: #1b8fa0;
  --warn-bg: #fff3d6;
  --warn-ink: #6b4a00;
  --warn-line: #f0d48a;
  --good: #1f7a33;
  --star: #d48a00;
  /* tiers: ordinal ramp from the accent hue (A = most saturated) */
  --tier-a: #0b5d68; --tier-a-ink: #ffffff;
  --tier-b: #3592a0; --tier-b-ink: #ffffff;
  --tier-c: #a7d0d5; --tier-c-ink: #0f1a22;
  --tier-d: #dde5e7; --tier-d-ink: #47545f;
  /* signal categories: validated categorical slots 1-6, fixed order */
  --cat-regulatory: #2a78d6;
  --cat-data_sensitivity: #eb6834;
  --cat-attack_surface: #1baf7a;
  --cat-growth: #eda100;
  --cat-maturity_gap: #e87ba4;
  --cat-timing: #008300;
  --bar-fit: #5f6f7c;
  --bar-intent: var(--accent);
  --heat-0: #f4f7f8;
  --shadow: 0 1px 2px rgba(15, 26, 34, .06), 0 8px 24px rgba(15, 26, 34, .08);
  --scrim: rgba(15, 26, 34, .32);
  /* type */
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --fs-xs: .72rem; --fs-sm: .8125rem; --fs-md: .875rem; --fs-lg: 1.0625rem; --fs-xl: 1.375rem; --fs-hero: 2.5rem;
  --radius: 6px;
  --row-h: 60px;
  --gutter: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1114; --surface: #131a1e; --surface-2: #1a2328; --surface-3: #233038;
    --ink: #e6ecef; --ink-2: #a8b4bc; --muted: #7a8790; --line: #243039; --line-strong: #33424c;
    --accent: #4fc2cf; --accent-ink: #062226; --accent-soft: #143238; --focus: #6fd6e2;
    --warn-bg: #3a2c08; --warn-ink: #f6d488; --warn-line: #6b5212; --good: #4cc463; --star: #f2b33d;
    --tier-a: #5fd3de; --tier-a-ink: #062226; --tier-b: #2f909b; --tier-b-ink: #ffffff;
    --tier-c: #24636b; --tier-c-ink: #e3f4f6; --tier-d: #3a4a53; --tier-d-ink: #d0dadf;
    --cat-regulatory: #3987e5; --cat-data_sensitivity: #d95926; --cat-attack_surface: #199e70;
    --cat-growth: #c98500; --cat-maturity_gap: #d55181; --cat-timing: #008300;
    --bar-fit: #8b9aa5; --heat-0: #172025;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1114; --surface: #131a1e; --surface-2: #1a2328; --surface-3: #233038;
  --ink: #e6ecef; --ink-2: #a8b4bc; --muted: #7a8790; --line: #243039; --line-strong: #33424c;
  --accent: #4fc2cf; --accent-ink: #062226; --accent-soft: #143238; --focus: #6fd6e2;
  --warn-bg: #3a2c08; --warn-ink: #f6d488; --warn-line: #6b5212; --good: #4cc463; --star: #f2b33d;
  --tier-a: #5fd3de; --tier-a-ink: #062226; --tier-b: #2f909b; --tier-b-ink: #ffffff;
  --tier-c: #24636b; --tier-c-ink: #e3f4f6; --tier-d: #3a4a53; --tier-d-ink: #d0dadf;
  --cat-regulatory: #3987e5; --cat-data_sensitivity: #d95926; --cat-attack_surface: #199e70;
  --cat-growth: #c98500; --cat-maturity_gap: #d55181; --cat-timing: #008300;
  --bar-fit: #8b9aa5; --heat-0: #172025;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .4); --scrim: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--fs-md); line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 88%; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 24px; padding: 10px var(--gutter); background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; color: var(--accent); flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-stretch: 112%; font-size: 1.05rem; letter-spacing: .01em; text-transform: uppercase; line-height: 1.1; }
.brand-meta { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tabs { display: flex; gap: 2px; margin-left: auto; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: var(--radius); color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--accent); }
.count-pill { font-size: var(--fs-xs); background: var(--surface-3); color: var(--ink-2); border-radius: 99px; padding: 0 6px; min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.icp-pill { font-size: var(--fs-xs); font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 99px; padding: 2px 8px; white-space: nowrap; cursor: pointer; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.icon-btn svg { width: 18px; height: 18px; }

.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px var(--gutter); background: var(--warn-bg); color: var(--warn-ink); border-bottom: 1px solid var(--warn-line); font-size: var(--fs-sm); }
.banner strong { font-weight: 600; }
.banner .short { display: none; }
@media (max-width: 640px) { .banner .long { display: none; } .banner .short { display: inline; } }
.banner .tag { font-family: var(--font-mono); font-size: var(--fs-xs); border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; text-transform: uppercase; letter-spacing: .06em; }

.main { min-height: 0; overflow: auto; position: relative; }
.main.is-list { overflow: hidden; }
.loading, .error-box { padding: 48px var(--gutter); color: var(--muted); }
.error-box { color: var(--ink); max-width: 60ch; }

/* ---------- buttons & inputs ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--radius); padding: 6px 12px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.input, .select { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 7px 10px; font-size: var(--fs-sm); min-width: 0; }
.input::placeholder { color: var(--muted); }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 9px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); }
.search-wrap .input { padding-left: 30px; }
.chipset { display: flex; flex-wrap: wrap; gap: 4px; }
.toggle { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: var(--fs-sm); color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.toggle:hover { border-color: var(--ink-2); color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 500; }
.toggle .n { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.check { display: flex; gap: 8px; align-items: center; font-size: var(--fs-sm); cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
input[type="checkbox"] { accent-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); width: 100%; }

/* ---------- list view ---------- */
.list-view { height: 100%; display: grid; grid-template-columns: 272px minmax(0, 1fr); }
.filters { border-right: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 18px; }
.filters-head { display: flex; align-items: center; justify-content: space-between; }
.filters-head h2 { font-size: var(--fs-lg); }
.fgroup { display: flex; flex-direction: column; gap: 7px; }
.fgroup > label, .fgroup > .flabel { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.fgroup .mini { text-transform: none; letter-spacing: 0; font-weight: 400; }
.mini-link { background: none; border: 0; padding: 0; color: var(--accent); font-size: var(--fs-xs); }
.checklist { max-height: 188px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; }
.checklist .check { padding: 3px 0; justify-content: space-between; }
.checklist .check > span:first-of-type { display: flex; gap: 8px; align-items: center; min-width: 0; }
.checklist .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.checklist .n { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 2px 9px; font-size: var(--fs-xs); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

.results { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; min-height: 0; }
.results-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; padding: 16px var(--gutter) 10px; }
.results-head h1 { font-size: var(--fs-xl); font-weight: 700; }
.results-head .sub { color: var(--muted); font-size: var(--fs-sm); }
.results-head .spacer { flex: 1; }
.results-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters-toggle { display: none; }
.active-chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 var(--gutter) 10px; align-items: center; min-height: 0; }
.active-chips:empty { display: none; }
.achip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: var(--fs-xs); color: var(--ink-2); }
.achip b { color: var(--ink); font-weight: 600; }
.achip button { border: 0; background: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); padding: 0; line-height: 1; }
.achip button:hover { background: var(--surface-3); color: var(--ink); }

.table-wrap { margin: 0 var(--gutter) var(--gutter); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow-x: auto; overflow-y: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.grid-row { display: grid; grid-template-columns: 22px 26px minmax(170px, 2fr) minmax(130px, 1.3fr) 78px minmax(110px, 1fr) 36px 118px minmax(190px, 1.8fr) 112px; align-items: center; column-gap: 10px; padding: 0 12px 0 10px; min-width: 1060px; }
.size-inline { display: none; }

.thead { border-bottom: 1px solid var(--line); background: var(--surface); font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; height: 36px; }
.thead button.sort { border: 0; background: none; padding: 0; text-transform: inherit; letter-spacing: inherit; font-weight: inherit; color: inherit; display: inline-flex; align-items: center; gap: 4px; text-align: left; }
.thead button.sort:hover { color: var(--ink); }
.thead button.sort[data-active] { color: var(--ink); }
.thead button.sort .arr { font-size: 9px; width: 8px; }
.tbody { overflow-y: auto; position: relative; min-height: 0; }
.tbody-spacer { position: relative; }
.row { position: absolute; left: 0; right: 0; height: var(--row-h); border-bottom: 1px solid var(--line); cursor: pointer; background: var(--surface); }
.row:hover { background: var(--surface-2); }
.row.is-open { background: var(--accent-soft); }
.row.is-selected { box-shadow: inset 3px 0 0 var(--accent); }
.cell { min-width: 0; overflow: hidden; }
.cell.trunc { white-space: nowrap; text-overflow: ellipsis; }
.acct-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.acct-sub { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.acct-sub .ai-dot { color: var(--accent); font-weight: 600; }
.mobile-sub { display: none; }
.cell-2line { display: flex; flex-direction: column; min-width: 0; font-size: var(--fs-sm); }
.cell-2line .a { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-2line .b { color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.star { border: 0; background: none; width: 26px; height: 26px; display: grid; place-items: center; color: var(--line-strong); padding: 0; border-radius: 4px; }
.star:hover { color: var(--star); background: var(--surface-3); }
.star svg { width: 17px; height: 17px; }
.star[aria-pressed="true"] { color: var(--star); }
.star[aria-pressed="true"] svg path { fill: currentColor; }

.tier { display: inline-grid; place-items: center; width: 26px; height: 22px; border-radius: 4px; font-family: var(--font-display); font-weight: 800; font-size: .8rem; font-stretch: 100%; }
.tier-A { background: var(--tier-a); color: var(--tier-a-ink); }
.tier-B { background: var(--tier-b); color: var(--tier-b-ink); }
.tier-C { background: var(--tier-c); color: var(--tier-c-ink); }
.tier-D { background: var(--tier-d); color: var(--tier-d-ink); }
.tier.lg { width: 38px; height: 32px; font-size: 1.05rem; }
.moved { font-size: 10px; color: var(--good); font-weight: 600; margin-left: 2px; }
.moved.down { color: var(--muted); }

.prio { display: grid; grid-template-columns: 30px 1fr; align-items: center; column-gap: 8px; }
.prio-num { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-stretch: 90%; font-variant-numeric: tabular-nums; text-align: right; }
.fi { display: flex; flex-direction: column; gap: 3px; }
.fi-bar { height: 4px; border-radius: 2px; background: var(--surface-3); position: relative; overflow: hidden; }
.fi-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 2px 2px 0; }
.fi-bar.f i { background: var(--bar-fit); }
.fi-bar.i i { background: var(--bar-intent); }

.chips { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; overflow: hidden; }
.chips .chip-line { display: flex; gap: 6px; align-items: center; max-width: 100%; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 1px 7px 1px 6px; font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--ink-2); max-width: 100%; }
.chip .dot, .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--muted); display: inline-block; }
.chip .more { color: var(--muted); }
.more-n { font-size: var(--fs-xs); color: var(--muted); align-self: center; white-space: nowrap; }
.play { font-size: var(--fs-sm); font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.play::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: 0; }
.play-compliance::before { background: var(--cat-regulatory); }
.play-scale_up::before { background: var(--cat-growth); }
.play-exposed_surface::before { background: var(--cat-attack_surface); }
.play-modernise::before { background: var(--cat-maturity_gap); }
.play-nurture { color: var(--muted); }
.play-text { color: var(--ink-2); }
.empty { padding: 48px 24px; text-align: center; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: var(--fs-lg); margin-bottom: 6px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 40; transform: translateX(105%); transition: transform .22s ease; overflow-y: auto; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.open { transform: none; }
.d-head { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
.d-head h2 { font-size: 1.35rem; font-weight: 700; }
.d-head .d-sub { color: var(--muted); font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.d-head .d-actions { display: flex; gap: 6px; align-items: flex-start; grid-row: span 2; }
.d-body { padding: 4px 20px 32px; display: flex; flex-direction: column; }
.d-sec { padding: 18px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.d-sec:last-child { border-bottom: 0; }
.d-sec h3 { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: var(--font-body); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.score-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.score-big { display: flex; align-items: center; gap: 10px; }
.score-big .n { font-family: var(--font-display); font-size: var(--fs-hero); font-weight: 800; font-stretch: 85%; line-height: 1; font-variant-numeric: tabular-nums; }
.formula { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--ink-2); line-height: 1.6; }
.formula b { color: var(--ink); font-weight: 500; }

const tierOf = (p) => (p >= 75 ? "A" : p >= 60 ? "B" : p >= 40 ? "C" : "D");
const humanize = (id) => String(id).replace(/[_-]+/g, " ").replace(/^\w/, (c) => c.toUpperCase());
const money = (v) => { const n = num(v); if (n === null) return "—"; if (n >= 1e9) return `$${(n / 1e9).toFixed(1)}B`; if (n >= 1e6) return `$${(n / 1e6).toFixed(1)}M`; if (n >= 1e3) return `$${Math.round(n / 1e3)}K`; return `$${n}`; };
const catColor = (c) => (CATS.includes(c) ? `var(--cat-${c})` : "var(--muted)");
const playLabel = (p) => PLAYS[p]?.label || (p ? humanize(p) : "—");
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : JSON.parse(v); } catch { return fb; } }

function objNums(o) { const out = {}; if (o && typeof o === "object") for (const [k, v] of Object.entries(o)) { const n = num(v); if (n !== null) out[k] = n; } return out; }
const sumVals = (o) => Object.values(o).reduce((s, v) => s + v, 0);

/* ============================== state ============================== */
const S = {
  meta: {}, accounts: [], byId: new Map(), source: "",
  sigCatalog: new Map(), // id -> {id,label,category,count}
  facets: { countries: [], industries: [], bands: [], plays: [] },
  view: "list",
  f: defaultFilters(),
  sort: { key: "priority", dir: "desc" },
  rows: [], openId: null, selected: new Set(),
  shortlist: new Set(lsGet(LS.shortlist, [])),
  tuner: null, tunerBase: null, tuned: false,
  heatMetric: lsGet(LS.heat, "ab"),
};
function defaultFilters() { return { q: "", country: "", state: "", industries: [], bands: [], tiers: [], signals: [], sigMode: "any", plays: [], ai: false }; }

/* ============================== data loading ============================== */
async function loadData() {
  const emb = document.getElementById("embedded-data");
  if (emb && emb.textContent.trim().length > 2) return { doc: JSON.parse(emb.textContent), src: emb.dataset.source || "embedded" };
  const errors = [];
  for (const url of ["data/accounts.json", "data/accounts.sample.json"]) {
    try {
      const r = await fetch(url, { cache: "no-cache" });
      if (r.ok) return { doc: await r.json(), src: url };
      errors.push(`${url}: HTTP ${r.status}`);
    } catch (e) { errors.push(`${url}: ${e.message}`); }
  }
  throw new Error(errors.join("; "));
}

function normalise(doc) {
  const meta = doc && typeof doc.meta === "object" && doc.meta ? doc.meta : {};
  const w = meta.weights || {};
  let wf = num(w.fit), wi = num(w.intent);
  if (wf === null && wi === null) { wf = 0.5; wi = 0.5; } else if (wf === null) wf = 1 - wi; else if (wi === null) wi = 1 - wf;
  const tot = wf + wi || 1; wf /= tot; wi /= tot;
  meta._wf = wf; meta._wi = wi;
  const list = Array.isArray(doc?.accounts) ? doc.accounts : [];
  const accounts = [];
  list.forEach((raw, i) => {
    if (!raw || typeof raw !== "object") return;
    const a = raw;
    a.id = a.id != null ? String(a.id) : `row-${i}`;
    a.name = a.name ? String(a.name) : (a.domain || "Unnamed company");
    a.signals = (Array.isArray(a.signals) ? a.signals : []).filter((s) => s && typeof s === "object").map((s) => ({
      id: String(s.id ?? s.label ?? "signal"), label: String(s.label ?? humanize(s.id ?? "signal")),
      category: CATS.includes(s.category) ? s.category : "other", weight: num(s.weight) ?? 0, evidence: s.evidence ? String(s.evidence) : "",
    })).sort((x, y) => y.weight - x.weight);
    a.$fb = objNums(a.fit_breakdown);
    a.$ib = objNums(a.intent_breakdown);
    const fit = num(a.fit_score) ?? clamp(sumVals(a.$fb), 0, 100);
    const intent = num(a.intent_score) ?? clamp(sumVals(a.$ib), 0, 100);
    const pri = num(a.priority_score) ?? Math.round(wf * fit + wi * intent);
    a.$fit0 = fit; a.$intent0 = intent; a.$pri0 = pri;
    a.$tier0 = TIERS.includes(a.tier) ? a.tier : tierOf(pri);
    a.$band = BAND_ORDER.includes(a.size_band) ? a.size_band : (a.size_band ? String(a.size_band) : "unknown");
    a.$llm = a.llm && typeof a.llm === "object" ? a.llm : null;
    a.$sigIds = new Set(a.signals.map((s) => s.id));
    a.$hay = [a.name, a.domain, a.city, a.state, a.country, a.industry, a.segment, a.description, ...a.signals.map((s) => s.label)].filter(Boolean).join(" ").toLowerCase();
    accounts.push(a);
  });
  // baseline rank
  [...accounts].sort((x, y) => y.$pri0 - x.$pri0).forEach((a, i) => { a.$rank0 = i + 1; });
  return { meta, accounts };
}

function buildFacets() {
  const cnt = (key) => { const m = new Map(); for (const a of S.accounts) { const v = typeof key === "function" ? key(a) : a[key]; if (v) m.set(v, (m.get(v) || 0) + 1); } return m; };
  const countries = cnt("country");
  S.facets.countries = [...countries].sort((a, b) => b[1] - a[1]);
  S.facets.industries = [...cnt("industry")].sort((a, b) => b[1] - a[1]);
  const bands = cnt((a) => a.$band);
  S.facets.bands = [...bands].sort((a, b) => bandIdx(a[0]) - bandIdx(b[0]));
  S.facets.plays = [...cnt("play")].sort((a, b) => b[1] - a[1]);
  const cat = new Map();
  for (const a of S.accounts) for (const s of a.signals) {
    let e = cat.get(s.id);
    if (!e) { e = { id: s.id, labels: new Map(), category: s.category, count: 0 }; cat.set(s.id, e); }
    e.count++; e.labels.set(s.label, (e.labels.get(s.label) || 0) + 1);
  }
  for (const e of cat.values()) {
    // signal labels can embed numbers ("Headcount up 23%"); use one label if they all agree, else the id
    e.label = e.labels.size === 1 ? [...e.labels.keys()][0] : humanize(e.id);
    delete e.labels;
  }
  S.sigCatalog = new Map([...cat].sort((a, b) => b[1].count - a[1].count));
}
const bandIdx = (b) => { const i = BAND_ORDER.indexOf(b); return i === -1 ? 50 : i; };

/* ============================== scoring / ICP tuner ============================== */
function tunerDefaults() {
  return { wi: Math.round(S.meta._wi * 100), mult: Object.fromEntries(CATS.map((c) => [c, 1])), offBands: [], offCountries: [] };
}
function isTunerDefault(t) {
  const d = S.tunerBase;
  return t.wi === d.wi && CATS.every((c) => (t.mult[c] ?? 1) === 1) && !t.offBands.length && !t.offCountries.length;
}
function rescore() {
  const t = S.tuner;
  S.tuned = !isTunerDefault(t);
  const wi = t.wi / 100, wf = 1 - wi;
  const offB = new Set(t.offBands), offC = new Set(t.offCountries);
  for (const a of S.accounts) {
    if (!S.tuned) { a.$fit = a.$fit0; a.$intent = a.$intent0; a.$pri = a.$pri0; a.$tier = a.$tier0; continue; }
    // fit: zero the size / geo component when outside the target bands / countries, rescaled to the pipeline's fit scale
    let fit = a.$fit0;
    const fbSum = sumVals(a.$fb);
    if (fbSum > 0) {
      let adj = 0;
      for (const [k, v] of Object.entries(a.$fb)) {
        if (k === "size" && offB.has(a.$band)) continue;
        if (k === "geo" && a.country && offC.has(a.country)) continue;
        adj += v;
      }
      fit = a.$fit0 * (adj / fbSum);
    }
    // intent: sum of category points × multiplier, capped at 100 (contract §3)
    let intent = a.$intent0;
    if (Object.keys(a.$ib).length) {
      let s = 0;
      for (const [k, v] of Object.entries(a.$ib)) s += v * (t.mult[k] ?? 1);
      intent = Math.min(100, s);
    }
    a.$fit = Math.round(clamp(fit, 0, 100));
    a.$intent = Math.round(clamp(intent, 0, 100));
    a.$pri = Math.round(wf * a.$fit + wi * a.$intent);
    a.$tier = tierOf(a.$pri);
  }
  [...S.accounts].sort((x, y) => y.$pri - x.$pri || x.$rank0 - y.$rank0).forEach((a, i) => { a.$rank = i + 1; });
  const pill = $("#icp-pill"); if (pill) pill.hidden = !S.tuned;
}
function saveTuner() { lsSet(LS.tuner, S.tuner); }

/* ============================== filtering & sorting ============================== */
function matches(a, f) {
  if (f.country && a.country !== f.country) return false;
  if (f.state && a.state !== f.state) return false;
  if (f.industries.length && !f.industries.includes(a.industry)) return false;
  if (f.bands.length && !f.bands.includes(a.$band)) return false;
  if (f.tiers.length && !f.tiers.includes(a.$tier)) return false;
  if (f.plays.length && !f.plays.includes(a.play)) return false;
  if (f.ai && !a.$llm) return false;
  if (f.signals.length) {
    if (f.sigMode === "all") { if (!f.signals.every((s) => a.$sigIds.has(s))) return false; }
    else if (!f.signals.some((s) => a.$sigIds.has(s))) return false;
  }
  if (f.q) { for (const tok of f.q.toLowerCase().split(/\s+/)) if (tok && !a.$hay.includes(tok)) return false; }
  return true;
}
const SORTERS = {
  name: (a) => a.name.toLowerCase(),
  segment: (a) => (a.segment || "~").toLowerCase(),
  size: (a) => a.employee_count ?? (bandIdx(a.$band) < 50 ? [5, 30, 120, 350, 750, 3000, 8000, -1][bandIdx(a.$band)] : -1),
  location: (a) => [a.country, a.state, a.city].filter(Boolean).join(" ").toLowerCase() || "~",
  tier: (a) => TIERS.indexOf(a.$tier),
  priority: (a) => a.$pri,
  signals: (a) => a.signals.length,
  play: (a) => a.play || "~",
};
function computeRows() {
  let rows;
  if (S.view === "shortlist") rows = S.accounts.filter((a) => S.shortlist.has(a.id));
  else rows = S.accounts.filter((a) => matches(a, S.f));
  const get = SORTERS[S.sort.key] || SORTERS.priority;
  const dir = S.sort.dir === "asc" ? 1 : -1;
  rows.sort((x, y) => { const a = get(x), b = get(y); if (a < b) return -dir; if (a > b) return dir; return y.$pri - x.$pri || x.name.localeCompare(y.name); });
  S.rows = rows;
}
function activeFilterCount(f = S.f) {
  return (f.q ? 1 : 0) + (f.country ? 1 : 0) + (f.state ? 1 : 0) + f.industries.length + f.bands.length + f.tiers.length + f.signals.length + f.plays.length + (f.ai ? 1 : 0);
}

/* ============================== URL hash (shareable views) ============================== */
let lastHash = "";
function writeHash() {
  const p = new URLSearchParams();
  if (S.view !== "list") p.set("v", S.view);
  const f = S.f;
  if (f.q) p.set("q", f.q);
  if (f.country) p.set("co", f.country);
  if (f.state) p.set("st", f.state);
  if (f.industries.length) p.set("in", f.industries.join("~"));
  if (f.bands.length) p.set("sb", f.bands.join("~"));
  if (f.tiers.length) p.set("t", f.tiers.join(""));
  if (f.signals.length) p.set("sg", f.signals.join("~"));
  if (f.signals.length > 1 && f.sigMode === "all") p.set("sm", "all");
  if (f.plays.length) p.set("pl", f.plays.join("~"));
  if (f.ai) p.set("ai", "1");
  if (!(S.sort.key === "priority" && S.sort.dir === "desc")) p.set("s", `${S.sort.key}.${S.sort.dir}`);
  if (S.openId) p.set("a", S.openId);
  const h = p.toString();
  lastHash = h;
  try { history.replaceState(null, "", h ? `#${h}` : location.pathname + location.search); } catch { /* sandboxed */ }
}
function readHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.replace(/^#/, "")); } catch { h = location.hash.replace(/^#/, ""); }
  if (h === lastHash && h) return false;
  if (["list", "market", "tuner", "shortlist"].includes(h)) { S.view = h; return true; }
  if (!h.includes("=")) return false;
  const p = new URLSearchParams(h);
  const split = (k) => (p.get(k) ? p.get(k).split("~").filter(Boolean) : []);
  S.view = ["list", "market", "tuner", "shortlist"].includes(p.get("v")) ? p.get("v") : "list";
  S.f = {
    q: p.get("q") || "", country: p.get("co") || "", state: p.get("st") || "",
    industries: split("in"), bands: split("sb"), tiers: (p.get("t") || "").split("").filter((t) => TIERS.includes(t)),
    signals: split("sg"), sigMode: p.get("sm") === "all" ? "all" : "any", plays: split("pl"), ai: p.get("ai") === "1",
  };
  const s = (p.get("s") || "").split(".");
  S.sort = SORTERS[s[0]] ? { key: s[0], dir: s[1] === "asc" ? "asc" : "desc" } : { key: "priority", dir: "desc" };
  S.openId = p.get("a") || null;
  return true;
}

function rowH() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row-h")) || 60; }

function renderFilters() {

  if (!el) return;
  const f = S.f;

  const indQ = $("#ind-search")?.value || "", sigQ = $("#sig-search")?.value || "";
  const states = new Map();
  for (const a of S.accounts) if (a.state && (!f.country || a.country === f.country)) states.set(a.state, (states.get(a.state) || 0) + 1);

    </div>
    <div class="d-sub">${a.domain ? `<span>${site ? `<a href="${esc(site)}" target="_blank" rel="noopener">${esc(a.domain)}</a>` : esc(a.domain)}</span>` : ""}<span>${esc(a.segment || a.industry || "")}</span>${loc ? `<span>${esc(loc)}</span>` : ""}<span class="num">Rank #${fmt(a.$rank)}</span></div>

  <div class="d-body">

function aiSection(a) {

    <div class="trace"><span>model <b>${esc(L.model || "unknown")}</b></span>${pv.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>
  </section>`;

function briefToHtml(brief) {
  if (!brief) return "";
  if (Array.isArray(brief)) brief = brief.join("\n");
  const lines = String(brief).split(/\n+/).map((l) => l.trim()).filter(Boolean);
  const bullets = lines.filter((l) => /^([-*•]|\d+[.)])\s+/.test(l));
  if (bullets.length >= Math.max(1, lines.length - 1)) {
    return `<ul class="brief">${lines.map((l) => `<li>${esc(l.replace(/^([-*•]|\d+[.)])\s+/, ""))}</li>`).join("")}</ul>`;
  }
  return lines.map((l) => `<p class="rationale">${esc(l)}</p>`).join("");
}

function computeRowsForMarket() { S.marketRows = S.accounts.filter((a) => matches(a, S.f)); }

function tierBars(rows) {

function stackedBars(groups, attrFn, tipPrefix) {

/* ---------------------------- clipboard, toast, tooltip ---------------------------- */
function copyText(text, okMsg) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    toast(ok ? okMsg : "Copy is blocked here. Select the text and copy it manually.");
  };
  try {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast(okMsg), fallback);
    else fallback();
  } catch { fallback(); }
}
let toastTimer = 0;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}
function initTooltip() {
  const tip = $("#tip");
  let cur = null;
  document.addEventListener("pointerover", (e) => {
    const el = e.target.closest?.("[data-tip]");
    if (!el || e.pointerType === "touch") { if (cur && !el) { tip.hidden = true; cur = null; } return; }
    cur = el; tip.textContent = el.dataset.tip; tip.hidden = false; place(e);
  });
  document.addEventListener("pointermove", (e) => { if (cur) place(e); }, { passive: true });
  document.addEventListener("pointerout", (e) => { if (cur && !cur.contains(e.relatedTarget)) { tip.hidden = true; cur = null; } });
  document.addEventListener("scroll", () => { tip.hidden = true; cur = null; }, true);
  function place(e) {
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
    tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
  }
}

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "f-country") { S.f.country = t.value; S.f.state = ""; onFiltersChanged(); }
    else if (t.id === "f-state") { S.f.state = t.value; onFiltersChanged(); }
    else if (t.id === "f-ai") { S.f.ai = t.checked; onFiltersChanged(); }
    else if (t.id === "sel-all") {
      if (t.checked) S.rows.forEach((a) => S.selected.add(a.id)); else S.rows.forEach((a) => S.selected.delete(a.id));
      renderWindow(); updateExportLabel();
    } else if (t.dataset.ind !== undefined) {
      const v = t.dataset.ind; S.f.industries = t.checked ? [...S.f.industries, v] : S.f.industries.filter((x) => x !== v); onFiltersChanged();
    } else if (t.dataset.sig !== undefined) {
      const v = t.dataset.sig; S.f.signals = t.checked ? [...S.f.signals, v] : S.f.signals.filter((x) => x !== v); onFiltersChanged();
    }
  });
  let qTimer = 0;
  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = t.value.trim(); onFiltersChanged({ rerenderFilters: false }); const cb = $('[data-act="clear-filters"]'); if (cb) cb.disabled = !activeFilterCount(); }, 120); }
    else if (t.id === "ind-search") filterChecklist("ind-list", t.value);
    else if (t.id === "sig-search") filterChecklist("sig-list", t.value);
    else if (t.id === "t-wi") { S.tuner.wi = Number(t.value); onTunerChanged(); }
    else if (t.dataset.mult) { S.tuner.mult[t.dataset.mult] = Math.round(Number(t.value) * 10) / 10; onTunerChanged(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (!$("#modal").hidden) { $("#modal").hidden = true; return; }
      if (S.openId) { closeDrawer(); return; }
      closeFiltersSheet();
    } else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) {
      const q = $("#q"); if (q) { e.preventDefault(); q.focus(); }
    } else if ((e.key === "Enter" || e.key === " ") && document.activeElement?.classList.contains("row")) {
      e.preventDefault(); openDrawer(document.activeElement.dataset.id);
    }
  });
  window.addEventListener("hashchange", () => {
    if (readHash()) { render(); if (S.openId) openDrawer(S.openId); else closeDrawer(); }
  });
  let rTimer = 0;
  window.addEventListener("resize", () => { clearTimeout(rTimer); rTimer = setTimeout(() => { if ($("#tbody")) refreshResults(false); }, 120); });
}

/* ---------------------------- boot ---------------------------- */
function renderMeta() {
  const m = S.meta;
  const parts = [`${fmt(S.accounts.length)} accounts`];
  if (num(m.rows_total) && m.rows_total !== S.accounts.length) parts[0] += ` of ${fmt(m.rows_total)}`;
  if (m.generated_at) { const d = new Date(m.generated_at); if (!isNaN(d)) parts.push(`scored ${d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" })}`); }
  if (m.scoring_version) parts.push(m.scoring_version);
  const llm = m.llm || {};
  if (llm.enabled) parts.push(llm.synthetic ? "AI text: synthetic" : `AI: ${fmt(llm.calls)} calls${num(llm.cost_usd) != null ? `, $${Number(llm.cost_usd).toFixed(2)}` : ""}`);
  $("#meta-line").textContent = parts.join(" · ");
  const ban = $("#demo-banner");
  if (m.synthetic) {
    ban.innerHTML = `<span class="tag">Demo data (synthetic)</span><span class="long"><strong>These companies are invented.</strong> Accounts, signals and AI text are generated sample data for demonstrating the workflow. Run the pipeline to load real accounts.</span><span class="short"><strong>Invented companies</strong> for demonstration only.</span>`;
    ban.hidden = false;
  } else if (/sample/.test(S.source)) {
    ban.innerHTML = `<span class="tag">Sample file</span><span>Loaded ${esc(S.source)} because data/accounts.json was not found.</span>`;
    ban.hidden = false;
  }
}
async function boot() {
  applyTheme(lsGet(LS.theme, "system"));
  bindEvents();
  initTooltip();
  let loaded;
  try { loaded = await loadData(); } catch (err) {
    $("#main").innerHTML = `<div class="error-box"><h2>No account data found</h2><p>Perimeter Radar looks for <code>data/accounts.json</code>, then <code>data/accounts.sample.json</code>, next to this page. Build it with <code>python -m pipeline.build --out app/data/accounts.json</code>, or serve the app folder over HTTP (opening the file directly blocks loading).</p><p class="desc">${esc(err.message)}</p></div>`;
    $("#meta-line").textContent = "No data loaded";
    return;
  }
  const { meta, accounts } = normalise(loaded.doc);
  S.meta = meta; S.accounts = accounts; S.source = loaded.src;
  S.byId = new Map(accounts.map((a) => [a.id, a]));
  buildFacets();
  S.tunerBase = tunerDefaults();
  const saved = lsGet(LS.tuner, null);
  S.tuner = tunerDefaults();
  if (saved && typeof saved === "object") {
    if (Number.isFinite(saved.wi)) S.tuner.wi = clamp(saved.wi, 0, 100);
    if (saved.mult) for (const c of CATS) if (Number.isFinite(saved.mult[c])) S.tuner.mult[c] = clamp(saved.mult[c], 0, 3);
    if (Array.isArray(saved.offBands)) S.tuner.offBands = saved.offBands.filter((b) => typeof b === "string");
    if (Array.isArray(saved.offCountries)) S.tuner.offCountries = saved.offCountries.filter((b) => typeof b === "string");
  }
  // drop stale shortlist ids
  for (const id of [...S.shortlist]) if (!S.byId.has(id)) S.shortlist.delete(id);
  rescore();
  readHash();
  renderMeta();
  render();
  if (S.openId && S.byId.has(S.openId)) openDrawer(S.openId); else S.openId = null;
  document.documentElement.dataset.ready = "1";
}
boot();

</script>
